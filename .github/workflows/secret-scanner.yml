# This workflow is managed by gh actions-lock.
# SPDX-License-Identifier: MPL-2.0
name: Secret Scanner

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Self-contained execution of the estate secret-scanning contract pinned to
# metadatastician/standards@f0b3cd4c464d33e1584f8528c17bce104555e256.
# Produces the `scan / gitleaks` status check that the `Secret-Scan-Floor`
# ruleset (24309812) was created to require on `main`.
#
# HONEST STATUS OF THAT RULE (measured 2026-11-08): the ruleset is `active`
# with `conditions.ref_name.include: ["~DEFAULT_BRANCH"]` but carries
# `rules: []` and a repository-role-5 `bypass_actors` entry with
# `bypass_mode: always`. It currently requires NOTHING, so this check is
# PRODUCED and reported, not enforced. `GET /rules/branches/main` returns only
# `required_linear_history`. Do not describe these contexts as required without
# re-reading the live ruleset; see `.github/rulesets/README.adoc`.
#
# ─── WHY THREE JOBS, AND WHY THEY ARE INLINE ─────────────────────────────────
#
# The estate canonical wraps all three scanners in ONE reusable workflow call:
#
#     jobs:
#       scan:
#         uses: metadatastician/standards/.github/workflows/secret-scanner-reusable.yml@<sha>
#
# That shape cannot satisfy this repository's contract, and the reason is
# measured, not theoretical. A job-level reusable call produces exactly one
# check, named `<caller job name> / <called job name>` — so the wrapper above
# yields `scan / gitleaks`, `scan / rust-secrets` and `scan / shell-secrets`
# only while the called workflow happens to define jobs with those names. The
# wrapper's own job is named `scan`, so any rename inside the callee silently
# changes three public check names in every generated repository. Three
# required contexts that move when a remote repository is edited is not a
# contract.
#
# This repository therefore runs the same three scanners as three ordinary
# jobs whose `name:` IS the context:
#
#     scan / gitleaks        (gitleaks, estate baseline + repo config,
#                             working tree + full history + AsciiDoc mirror)
#     scan / rust-secrets    (hardcoded literals in .rs files; self-skips
#                             without a Cargo.toml)
#     scan / shell-secrets   (hardcoded literals in shell scripts)
#
# All three declare `permissions: contents: read` and NO `secrets:` line. The
# reusable declares no `workflow_call.secrets` and references no `secrets.*`
# context, so `secrets: inherit` on a caller buys nothing and forwards every
# repository and organisation secret to a scanner that needs none (CWE-250,
# standards#1108 §6b). Do not add it back.
#
# ─── actions.lock AND THIS FILE ──────────────────────────────────────────────
#
# Every `uses:` here is a step-level action that `gh actions-lock` knows how to
# lock, so the whole file is inside the generator's model: `gh actions-lock`
# records each ref and cannot produce a dangling edge for anything in it. That
# is deliberate. A job-level call to a remote reusable is NOT lockable by the
# tool, and a hand-added record for one is worse than no record: an entry that
# the runner cannot resolve fails the run at startup with zero jobs, while an
# absent one is merely unverified.
#
# Regenerate with the official generator only:
#
#     gh actions-lock                      # writes .github/workflows/actions.lock
#     gh actions-lock --verify             # read-only check
#     scripts/check-lock-sync.sh .github/workflows   # transitive-closure gate
#
# The scanner's own pin is a full 40-hex SHA in `STANDARDS_SHA` below and in the
# estate-baseline checkout, and it must match the standards pin every other
# workflow in this directory uses.
jobs:
  gitleaks:
    name: "scan / gitleaks"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: '8.18.4'
      GITLEAKS_SHA256: 'ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d'
      STANDARDS_SHA: 'f0b3cd4c464d33e1584f8528c17bce104555e256'
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout estate gitleaks baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: metadatastician/standards
          ref: f0b3cd4c464d33e1584f8528c17bce104555e256
          path: .standards-baseline
          sparse-checkout: config/gitleaks
          sparse-checkout-cone-mode: true
          persist-credentials: false

      - name: Stage estate baseline and install pinned gitleaks
        run: |
          set -euo pipefail
          cp .standards-baseline/config/gitleaks/estate-baseline.toml .gitleaks-estate.toml
          rm -rf .standards-baseline
          test -s .gitleaks-estate.toml

          TARBALL="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          URL="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${TARBALL}"
          curl -sSfL --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --retry 3 --retry-delay 2 \
            -o "$RUNNER_TEMP/$TARBALL" "$URL"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${TARBALL}" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$TARBALL" -C "$RUNNER_TEMP" gitleaks
          chmod +x "$RUNNER_TEMP/gitleaks"
          rm -f "$RUNNER_TEMP/$TARBALL"

      - name: Gitleaks working-tree pass
        run: |
          set -euo pipefail
          # The estate baseline always runs; a repository .gitleaks.toml adds a
          # second pass and can never stand in for the baseline.
          CONFIGS=(".gitleaks-estate.toml")
          if [ -f .gitleaks.toml ]; then
            CONFIGS+=(".gitleaks.toml")
          fi
          for CONFIG in "${CONFIGS[@]}"; do
            "$RUNNER_TEMP/gitleaks" detect \
              --source . \
              --no-git \
              --redact \
              --no-banner \
              --verbose \
              --config "$CONFIG" \
              --exit-code 1
          done

      - name: Gitleaks full-history pass
        run: |
          set -euo pipefail
          if [ "$(git rev-parse --is-shallow-repository)" != "false" ]; then
            echo "::error::checkout is shallow; refusing vacuous history scan"
            exit 1
          fi
          # The estate baseline always runs; a repository .gitleaks.toml adds a
          # second pass and can never stand in for the baseline.
          CONFIGS=(".gitleaks-estate.toml")
          if [ -f .gitleaks.toml ]; then
            CONFIGS+=(".gitleaks.toml")
          fi
          for CONFIG in "${CONFIGS[@]}"; do
            "$RUNNER_TEMP/gitleaks" detect \
              --source . \
              --redact \
              --no-banner \
              --verbose \
              --config "$CONFIG" \
              --exit-code 1
          done

      - name: Gitleaks AsciiDoc mirror pass
        run: |
          set -euo pipefail
          MIRROR="$RUNNER_TEMP/adoc-mirror"
          rm -rf "$MIRROR"
          mkdir -p "$MIRROR"
          found=0
          while IFS= read -r -d '' f; do
            dest="$MIRROR/$(dirname "$f")"
            mkdir -p "$dest"
            cp "$f" "$dest/$(basename "$f").txt"
            found=$((found + 1))
          done < <(find . -path ./.git -prune -o \( -name '*.adoc' -o -name '*.asciidoc' \) -type f -print0)

          if [ "$found" -eq 0 ]; then
            echo "No AsciiDoc files present."
            exit 0
          fi
          # The estate baseline always runs; a repository .gitleaks.toml adds a
          # second pass and can never stand in for the baseline.
          CONFIGS=("$PWD/.gitleaks-estate.toml")
          if [ -f .gitleaks.toml ]; then
            CONFIGS+=("$PWD/.gitleaks.toml")
          fi
          for CONFIG in "${CONFIGS[@]}"; do
            "$RUNNER_TEMP/gitleaks" detect \
              --source "$MIRROR" \
              --no-git \
              --redact \
              --no-banner \
              --config "$CONFIG" \
              --exit-code 1
          done

  rust-secrets:
    name: "scan / rust-secrets"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # Findings outside ./src (newly visible — see the scan-scope note in the
      # step below) warn until this date, then block. Same warn-then-enforce
      # idiom and same cutoff as the estate canonical reusable
      # (metadatastician/standards .github/workflows/secret-scanner-reusable.yml
      # at the pin named in this file's header), so this job and the reusable
      # cannot disagree about when the widened scan starts blocking.
      ENFORCE_RUST_WIDE_SCAN_FROM: '2026-08-21'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for hardcoded secrets in Rust
        run: |
          set -euo pipefail
          TODAY="${RUST_TODAY:-$(date -u +%Y-%m-%d)}"

          # An unparseable cutoff would pick the warn branch forever, silently
          # disarming the widened scan. Refuse to run instead.
          require_date() {
            local name="$1" value="$2"
            case "$value" in
              [0-9][0-9][0-9][0-9]-[0-1][0-9]-[0-3][0-9]) : ;;
              *) echo "::error::rust-secrets: $name='$value' is not YYYY-MM-DD."
                 echo "Refusing to run: an unparseable cutoff would disarm this gate."
                 exit 1 ;;
            esac
          }
          require_date ENFORCE_RUST_WIDE_SCAN_FROM "$ENFORCE_RUST_WIDE_SCAN_FROM"
          require_date RUST_TODAY "$TODAY"

          # Self-skips when the tree has no Cargo.toml, so the job is safe on a
          # repository that is not (yet) Rust. The check run still appears, which
          # is what keeps the context stable across every generated repository.
          if ! find . -name Cargo.toml -not -path './target/*' -print -quit | grep -q .; then
            echo 'No Cargo.toml found — skipping Rust secrets check'
            exit 0
          fi

          # Scan every .rs file, not just ./src. A Cargo workspace keeps its
          # code in crates/*/src, and a `grep … src/` matches nothing there:
          # grep exits 2 on a missing directory, which an `if` reads as "clean".
          mapfile -t FILES < <(find . -name '*.rs' \
            -not -path './target/*' -not -path '*/target/*' \
            -not -path './vendor/*' -not -path '*/vendor/*' \
            -not -path './.git/*' -print)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo 'Cargo.toml present but no .rs files — nothing to scan'
            exit 0
          fi
          echo "Scanning ${#FILES[@]} Rust file(s)."

          # Each pattern requires an assignment DIRECTLY to a string literal of
          # meaningful length, so lookups, paths and demos do not match. A
          # credential shorter than 8 characters is not a credential either.
          # `static` is accepted alongside `const`: a `static AUTH_KEY: &str =
          # "…"` is a genuine hardcoded secret.
          PATTERNS=(
            '(const|static)[[:space:]]+(mut[[:space:]]+)?[A-Za-z0-9_]*SECRET[A-Za-z0-9_]*[[:space:]]*(:[^=]*)?=[[:space:]]*b?"[^"]{8,}"'
            '(const|static)[[:space:]]+(mut[[:space:]]+)?[A-Za-z0-9_]*KEY[A-Za-z0-9_]*[[:space:]]*(:[^=]*)?=[[:space:]]*b?"[a-zA-Z0-9]{16,}"'
            '(const|static)[[:space:]]+(mut[[:space:]]+)?[A-Za-z0-9_]*TOKEN[A-Za-z0-9_]*[[:space:]]*(:[^=]*)?=[[:space:]]*b?"[^"]{8,}"'
            '(let|static)[[:space:]]+(mut[[:space:]]+)?[a-z0-9_]*api_key[a-z0-9_]*[[:space:]]*(:[^=]*)?=[[:space:]]*b?"[^"]{8,}"'
            'HMAC.*"[a-fA-F0-9]{32,}"'
            '[a-z0-9_]*password[a-z0-9_]*[[:space:]]*(:[^=]*)?=[[:space:]]*b?"[^"]{8,}"'
          )

          # Exemptions match on the VALUE or on an explicit pragma, never on a
          # file path: a path-based exemption would blind the job to a genuine
          # secret in the same file.
          #  1. env-lookup RHS — `env::var("NAME")` IS the practice this job
          #     exists to enforce, so flagging it fails the correct code.
          #  2. URL values — an OAuth endpoint is public, not a credential.
          #  3. comment lines — documentation of a pattern is not a secret.
          #  4. inline pragma `// scanner-allow: rust-secrets`.
          COMMENT='^[^:]*:[0-9][0-9]*:[[:space:]]*(//|/\*|\*)'
          ENV_RHS='=[^;]*(env::var|env::var_os|std::env|env!\(|option_env!\(|from_env|dotenv)'
          URL_RHS='=[[:space:]]*b?"(https?|wss?|ftp)://'
          PRAGMA='scanner-allow:[[:space:]]*rust-secrets'

          blocking=0
          advisory=0
          for pattern in "${PATTERNS[@]}"; do
            hits="$(grep -nHE "$pattern" "${FILES[@]}" 2>/dev/null \
              | grep -vE "$COMMENT" \
              | grep -vE "$ENV_RHS" \
              | grep -vE "$URL_RHS" \
              | grep -vE "$PRAGMA" || [ $? -eq 1 ])"
            [ -n "$hits" ] || continue

            # ./src hits keep blocking. Hits outside it are newly visible, so
            # they warn until the cutoff rather than reddening repositories
            # whose wider tree was never actually being scanned.
            old_scope="$(printf '%s\n' "$hits" | grep -E '^\./src/' || [ $? -eq 1 ])"
            new_scope="$(printf '%s\n' "$hits" | grep -vE '^\./src/' || [ $? -eq 1 ])"

            # Print file:line only. The matched source text is the credential
            # itself; echoing it would publish it to the Actions log.
            if [ -n "$old_scope" ]; then
              printf '%s\n' "$old_scope" | cut -d: -f1,2 | sed 's/$/: hardcoded-secret pattern match (line text withheld)/'
              echo "WARNING: Potential hardcoded secret found matching: $pattern"
              blocking=1
            fi
            if [ -n "$new_scope" ]; then
              printf '%s\n' "$new_scope" | cut -d: -f1,2 | sed 's/$/: hardcoded-secret pattern match (line text withheld)/'
              if [[ "$TODAY" < "$ENFORCE_RUST_WIDE_SCAN_FROM" ]]; then
                echo "::warning::Potential hardcoded secret outside ./src matching:" \
                     "$pattern — becomes BLOCKING on $ENFORCE_RUST_WIDE_SCAN_FROM (today is $TODAY)."
                advisory=1
              else
                echo "WARNING: Potential hardcoded secret found matching: $pattern"
                blocking=1
              fi
            fi
          done

          if [ "$blocking" -eq 1 ]; then
            echo "::error::Potential hardcoded secrets detected. Use environment variables instead."
            exit 1
          fi
          if [ "$advisory" -eq 1 ]; then
            # Never claim a clean pass while findings are outstanding.
            echo "NOT YET ENFORCED: findings outside ./src are advisory until $ENFORCE_RUST_WIDE_SCAN_FROM."
            exit 0
          fi
          echo 'No hardcoded secrets detected in Rust sources.'

  shell-secrets:
    name: "scan / shell-secrets"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run repository secret pattern hook
        run: |
          set -euo pipefail
          rc=0
          # Provider-specific patterns, plus assignment of a quoted literal to a
          # *_TOKEN / *_KEY / *_SECRET / password name (as in the estate canonical
          # reusable, metadatastician/standards@f0b3cd4
          # .github/workflows/secret-scanner-reusable.yml). The value classes
          # exclude '$', so ="${VAR}" and ="$VAR" never match. Only file names
          # are listed, never the matched text.
          SQ="'"
          ASSIGN="[A-Z_]*(TOKEN|API_KEY|SECRET)[A-Z_]*=[\"${SQ}][A-Za-z0-9_./+=-]{16,}[\"${SQ}]|PASS[W]ORD=[\"${SQ}][^\"${SQ}\$]{6,}[\"${SQ}]"
          PROVIDER='ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{82}|glpat-[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----'
          git grep -IlE "(${PROVIDER}|${ASSIGN})" > "$RUNNER_TEMP/hits.txt" || rc=$?
          # git grep exits 1 when nothing matches; above 1 is an error.
          if [ "$rc" -gt 1 ]; then
            echo "::error::Secret pattern scan failed with exit ${rc}"
            exit 2
          fi
          # Exclude intentional scanner rules and adversarial negative test fixtures.
          filtered="$(grep -vE '^(\.github/hooks/scan-secrets\.sh|\.github/workflows/secret-scanner\.yml|\.machine_readable/testing/adversarial-content\.k9\.ncl|tests/)' "$RUNNER_TEMP/hits.txt" || :)"
          if [ -n "$filtered" ]; then
            echo "::error::Hardcoded credential material detected:"
            printf '%s\n' "$filtered"
            exit 1
          fi
          echo "No hardcoded shell/source credentials detected."
