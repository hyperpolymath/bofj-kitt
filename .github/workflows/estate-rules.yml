#
# Estate Rules — enforces hyperpolymath estate-wide conventions:
#   * root shape (allowlist of permitted root entries)
#   * AsciiDoc-by-default (no .md files under docs/)
#   * zig is banned (no zig scaffolding or references)
#
# Each rule is enforced by an executable check script under scripts/. Failures
# are surfaced as workflow errors so the rule can't silently regress.

name: Estate Rules

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  estate-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Root shape allowlist
        run: bash scripts/check-root-shape.sh .

      - name: AsciiDoc by default (no .md under docs/)
        run: bash scripts/check-no-md-in-docs.sh .

      # Rendered environment settings are never hand-edited: this fails when
      # tools/environments/rendered/ drifts from the manifests, and checks
      # doctor's PRESENT/DRIFT/UNAVAILABLE reporting with stub tools.
      - name: provers engine format, lints and unit tests
        run: |
          cargo fmt --check --manifest-path tools/proof-toolchain/provers/Cargo.toml
          cargo clippy --locked --all-targets --manifest-path tools/proof-toolchain/provers/Cargo.toml -- -D warnings
          cargo test --locked --manifest-path tools/proof-toolchain/provers/Cargo.toml

      - name: provers.sh render drift and doctor reporting
        run: bash tests/provers_test.sh

      - name: Rendered setup script helpers (stub apt and curl)
        run: bash tests/setup_script_test.sh

      - name: Reachability probe (offline, stub curl)
        run: bash tests/probe_reachability_test.sh

