# This workflow is managed by gh actions-lock.
# SPDX-License-Identifier: MPL-2.0
#
# OPTIONAL: BoJ Server Build Trigger
# This workflow notifies a BoJ Server instance when code is pushed.
# It is a no-op if BOJ_SERVER_URL is not set. If the server cannot be reached, or
# refuses the request, it logs a warning with the HTTP status and the server's
# reply and does not fail the build.
# To enable: set BOJ_SERVER_URL as a repository secret or variable.
# To disable: delete this file or leave BOJ_SERVER_URL unset.
name: BoJ Server Build Trigger

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trigger-boj:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Trigger BoJ Server (Casket/ssg-mcp)
        env:
          BOJ_URL: ${{ secrets.BOJ_SERVER_URL || vars.BOJ_SERVER_URL }}
          REPO_NAME: ${{ github.repository }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [ -z "$BOJ_URL" ]; then
            echo "BOJ_SERVER_URL not configured - skipping"
            exit 0
          fi

          payload="$(jq -cn \
            --arg repo "$REPO_NAME" \
            --arg branch "$BRANCH_NAME" \
            --arg engine "casket" \
            '{repo:$repo, branch:$branch, engine:$engine}')"

          # Optional and non-fatal, but never silent: say which of "could not
          # connect" and "the server refused it" happened, with the HTTP status
          # and the server's reply. -S is left off and the URL is never printed,
          # because BOJ_URL may be a secret and curl's error text names the host.
          resp="$(mktemp)"
          trap 'rm -f "$resp"' EXIT
          if ! status="$(curl -s -o "$resp" -w '%{http_code}' -X POST \
              "${BOJ_URL}/cartridge/ssg-mcp/invoke" \
              -H "Content-Type: application/json" \
              --data "$payload")"; then
            echo "::warning::BoJ server could not be reached (no HTTP response) - skipping (non-fatal)"
            exit 0
          fi

          case "$status" in
            2??)
              echo "BoJ server accepted the request (HTTP $status)"
              ;;
            *)
              echo "::warning::BoJ server answered HTTP $status - the request was not accepted (non-fatal)"
              echo "Server reply (first 1000 bytes):"
              head -c 1000 "$resp"
              echo
              ;;
          esac
