# This workflow is managed by gh actions-lock.
# SPDX-License-Identifier: MPL-2.0
name: Central Estate CI/CD Audit

# Thin caller of the estate audit, which lives in hyperpolymath/cicd-suite as
# a reusable workflow and reports five component checks: governance,
# hygiene, manifests, languages, advisory. Do not copy the audit's steps in
# here. A copy freezes this repository at whatever cicd-suite commit its
# actions.lock happened to hold, and fixes made upstream never arrive.
#
# The pin is a full SHA, advanced weekly by track-estate-audit.yml (a PR
# whose own run of this audit is the check).
#
# ⚠ ONBOARDED in actions.lock at the full SHA, with the cicd-suite gate
# commits it reaches recorded as dependencies, the same form this
# repository's other cross-repository callers use (hypatia-scan.yml,
# secret-scanner.yml, scorecard.yml call hyperpolymath/standards at a full
# SHA and start normally). cicd-suite's own header records that an
# onboarded @main or tag ref startup-fails; a full SHA is not that case.
# If this run ever startup-fails with zero jobs, de-onboard it with
# cicd-suite/scripts/deonboard-estate-audit.sh and drop its entry from
# scripts/check-lock-sync.sh's expectations.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  estate:
    uses: hyperpolymath/proven-cicd-and-workflows/.github/workflows/main-estate-audit.yml@354c425571c1f27b66dd141daeb0e90fa0c26dd9 # proven-cicd-and-workflows (formerly cicd-suite)
